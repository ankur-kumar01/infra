# Main-context nginx config used ONLY by the CI lint stage (Jenkinsfile).
# Not deployed to the server — the server's own main nginx.conf does the
# equivalent includes (conf.d/common.conf + sites-enabled/*.conf).
#
# The lint stage mounts this repo's nginx/ dir at /nginx inside an
# nginx:alpine container, generates throwaway self-signed certs for every
# domain, then runs: nginx -t -c /nginx/nginx.conf

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Mirrors what the server loads
    include /nginx/common.conf;
    include /nginx/finzox.conf;
    include /nginx/aviator.conf;
    include /nginx/erp.conf;
}
