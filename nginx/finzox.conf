# Finzox (digital_viser) — public site.
# Managed by the infra repo — do NOT hand-edit on the server.
# Deployed to: /etc/nginx/sites-available/finzox.conf (+ symlink in sites-enabled/)
#
# Backend serves API + Socket.io + SPA + uploads from ONE container on loopback.
# Port 5000 must match docker-compose.prod.yml in the digital_viser repo.

server {
    listen 80;
    server_name finzox.live;

    # ACME HTTP-01 webroot (certbot writes here; infra pipeline issues certs)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name finzox.live;

    # Cert paths are managed by scripts/sync.sh via this snippet
    # (self-signed fallback before DNS, real cert after issuance)
    include /etc/nginx/snippets/ssl-finzox.live.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:finzox_ssl:10m;
    ssl_session_timeout 10m;

    # Security headers (moved from the old per-app nginx container)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Single entry — Express backend handles /api, /socket.io, /uploads, SPA catch-all
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # Socket.io websocket upgrade (games + live chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # server.js HTTPS-redirect guard relies on this header
        proxy_set_header X-Forwarded-Proto https;
        # Game sockets can idle — don't let default 60s kill them
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
