# Aviator — public site.
# Managed by the infra repo — do NOT hand-edit on the server.
# Deployed to: /etc/nginx/sites-available/aviator.conf (+ symlink in sites-enabled/)
#
# Three upstream containers (see docker-compose.prod.yml in the Aviator repo):
#   backend  : API + Socket.io          -> 127.0.0.1:5011
#   frontend : user SPA (static)        -> 127.0.0.1:5012
#   admin    : admin SPA (base /admin/) -> 127.0.0.1:5013

server {
    listen 80;
    server_name aviator.finzox.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name aviator.finzox.live;

    # Cert paths are managed by scripts/sync.sh via this snippet
    # (self-signed fallback before DNS, real cert after issuance)
    include /etc/nginx/snippets/ssl-aviator.finzox.live.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:aviator_ssl:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- API ---
    location /api/ {
        proxy_pass http://127.0.0.1:5011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # --- Socket.io (game rounds must not drop on idle) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Admin SPA (trailing slash strips the /admin/ prefix) ---
    location /admin/ {
        proxy_pass http://127.0.0.1:5013/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- User SPA (everything else) ---
    location / {
        proxy_pass http://127.0.0.1:5012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
