# University ERP (Next.js) — public site.
# Managed by the infra repo — do NOT hand-edit on the server.
# Deployed to: /etc/nginx/sites-available/erp.conf (+ symlink in sites-enabled/)
#
# Next.js standalone server on loopback (see docker-compose.prod.yml in the erp repo).
# Port 5021 must match the compose file.

server {
    listen 80;
    server_name erp.finzox.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.finzox.live;

    # Cert paths are managed by scripts/sync.sh via this snippet
    # (self-signed fallback before DNS, real cert after issuance)
    include /etc/nginx/snippets/ssl-erp.finzox.live.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:erp_ssl:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Next.js server handles SSR + static assets natively
    location / {
        proxy_pass http://127.0.0.1:5021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
