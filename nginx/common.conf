# Common HTTP-level nginx settings — shared by ALL app site confs.
# Managed by the infra repo — do NOT hand-edit on the server.
# Deployed to: /etc/nginx/conf.d/common.conf
# (Ubuntu main nginx.conf includes conf.d/ BEFORE sites-enabled/, so these
# act as http-level defaults; site confs can still override per location.)

# --- Gzip ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

# --- Upload size (matches previous per-app nginx containers) ---
client_max_body_size 50m;

# --- Timeouts / perf ---
keepalive_timeout 65;
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# --- Proxy defaults available to all site confs ---
# (site confs still set Upgrade/Connection per location for websockets)
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
