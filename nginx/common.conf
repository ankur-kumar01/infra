# Common HTTP-level nginx settings — shared by ALL app site confs.
# Managed by the infra repo — do NOT hand-edit on the server.
# Deployed to: /etc/nginx/conf.d/common.conf
#
# NOTE: Ubuntu's main nginx.conf already provides sendfile, tcp_nopush,
# tcp_nodelay, keepalive_timeout and gzip — redeclaring them here makes
# nginx -t fail with "directive is duplicate". Only add settings that
# Ubuntu does NOT set by default.

# --- Upload size (matches previous per-app nginx containers) ---
client_max_body_size 50m;

# --- Proxy defaults available to all site confs ---
# (site confs still set Upgrade/Connection per location for websockets)
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
